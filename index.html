<script>

var owned={},dupes={};
var albums=[],currentAlbumId=null;
function loadAlbums(){
  try{var d=JSON.parse(localStorage.getItem("panini2026_albums"));if(d&&d.length)albums=d;else albums=[];}catch(e){albums=[];}
  try{currentAlbumId=localStorage.getItem("panini2026_current")||null;}catch(e){}
  if(albums.length===0){
    var migOwned={},migDupes={};
    try{var old=JSON.parse(localStorage.getItem("panini2026"));if(old){migOwned=old.owned||{};migDupes=old.dupes||{};}}catch(e){}
    albums=[{id:"main",name:"Mi Álbum",owned:migOwned,dupes:migDupes}];
    currentAlbumId="main";
    saveAlbums();
  }
  if(!currentAlbumId) currentAlbumId=albums[0].id;
  var a=getAlbum(currentAlbumId);
  if(!a){currentAlbumId=albums[0].id;a=albums[0];}
  owned=a.owned;dupes=a.dupes;
}
function getAlbum(id){for(var i=0;i<albums.length;i++)if(albums[i].id===id)return albums[i];return null;}
function saveAlbums(){
  var a=getAlbum(currentAlbumId);if(a){a.owned=owned;a.dupes=dupes;}
  try{localStorage.setItem("panini2026_albums",JSON.stringify(albums));localStorage.setItem("panini2026_current",currentAlbumId);}catch(e){}
}
var _saveT=0;
function save(){clearTimeout(_saveT);_saveT=setTimeout(saveAlbums,100);}
function saveNow(){clearTimeout(_saveT);saveAlbums();}
function switchAlbum(id){
  var a=getAlbum(currentAlbumId);if(a){a.owned=owned;a.dupes=dupes;}
  currentAlbumId=id;var b=getAlbum(id);
  if(b){owned=b.owned;dupes=b.dupes;}
  saveAlbums();render();

// Migrate old C1-C12 codes to CC1-CC14
(function(){
  var migMap={"C1":"CC1","C2":"CC2","C3":"CC3","C4":"CC4","C6":"CC7","C8":"CC10","C9":"CC11","C11":"CC14","C12":"CC9"};
  var did=false;
  for(var ai=0;ai<albums.length;ai++){
    var a=albums[ai],nOwn={},nDup={};
    for(var k in a.owned){
      var nk=migMap[k]||k;
      nOwn[nk]=a.owned[k];
    }
    for(var k in a.dupes){
      var nk=migMap[k]||k;
      nDup[nk]=(nDup[nk]||0)+a.dupes[k];
    }
    if(JSON.stringify(nOwn)!==JSON.stringify(a.owned)){did=true;}
    a.owned=nOwn;a.dupes=nDup;
  }
  if(did){
    var cur=getAlbum(currentAlbumId);
    if(cur){owned=cur.owned;dupes=cur.dupes;}
    saveAlbums();
  }
})();

function getAlbumHist(id){if(!albumHistory[id])albumHistory[id]=[];return albumHistory[id];}
function addToHistory(albumId,code){
  var hist=getAlbumHist(albumId);
  var today=new Date().toDateString();
  var last=hist.length>0?hist[hist.length-1]:null;
  if(last&&last.date===today){if(last.codes.indexOf(code)<0)last.codes.push(code);}
  else{hist.push({date:today,codes:[code]});}
  if(hist.length>30)hist.splice(0,hist.length-30);
  saveHistory();
}
function getTodayCount(albumId){
  var hist=getAlbumHist(albumId);
  if(hist.length===0)return 0;

}

function getAllCodes(){
  var codes={};
  for(var i=0;i<SECS.length;i++)
    for(var j=0;j<SECS[i].stickers.length;j++) codes[SECS[i].stickers[j].c.toUpperCase()]=true;
  return codes;
}
function bulkAdd(){
  var ta=document.getElementById("bulkta");
  if(!ta) return;
  var raw=ta.value;
  var parts=raw.split(/[,;\s\n]+/);
  var valid=getAllCodes(),added=0,newCount=0,dupeCount2=0,bad=[];
  for(var i=0;i<parts.length;i++){
    var c=parts[i].trim().toUpperCase();if(!c) continue;
    var found=null;
    for(var si=0;si<SECS.length&&!found;si++)
      for(var sj=0;sj<SECS[si].stickers.length;sj++)
        if(SECS[si].stickers[sj].c.toUpperCase()===c){found=SECS[si].stickers[sj].c;break;}
    if(found){
      if(!owned[found]){owned[found]=true;addToHistory(currentAlbumId,found);newCount++;added++;}
      else{dupes[found]=(dupes[found]||0)+1;dupeCount2++;added++;}
    }
    else bad.push(c);
  }
  save();
  var msg="✅ "+added+" lámina"+(added!==1?"s":"")+" registrada"+(added!==1?"s":"");
  if(newCount>0) msg+=" ("+newCount+" nueva"+(newCount!==1?"s":"")+")";
  if(dupeCount2>0) msg+=" ("+dupeCount2+" al inventario)";
  if(bad.length>0) msg+=" | ⚠️ No encontradas: "+bad.join(", ");
  bulkResult={ok:bad.length===0,msg:msg};bulkText="";render();
}
function bulkRemove(){
  var ta=document.getElementById("bulkta");
  if(!ta) return;
  var raw=ta.value;
  var parts=raw.split(/[,;\s\n]+/);
  var removed=0,bad=[],mainWarn=[];
  for(var i=0;i<parts.length;i++){
    var c=parts[i].trim().toUpperCase();if(!c) continue;
    var found=null;
    for(var si=0;si<SECS.length&&!found;si++)
      for(var sj=0;sj<SECS[si].stickers.length;sj++)
        if(SECS[si].stickers[sj].c.toUpperCase()===c){found=SECS[si].stickers[sj].c;break;}
    if(found&&owned[found]){
      if(dupes[found]&&dupes[found]>0){dupes[found]--;if(dupes[found]===0)delete dupes[found];removed++;}
      else{mainWarn.push(found);}
    }
    else if(!found) bad.push(c);
  }
  if(mainWarn.length>0){
    showModal('Las siguientes láminas no tienen repetidas y se eliminarán del álbum:<br><strong>'+mainWarn.join(', ')+'</strong><br>¿Continuar?','Eliminar','modal-danger',function(){
      for(var i=0;i<mainWarn.length;i++){delete owned[mainWarn[i]];delete dupes[mainWarn[i]];removed++;}
      save();
      var msg="❌ "+removed+" lámina"+(removed!==1?"s":"")+" quitada"+(removed!==1?"s":"");
      if(bad.length>0) msg+=" | ⚠️ No encontradas: "+bad.join(", ");
      bulkResult={ok:bad.length===0,msg:msg};bulkText="";render();
    });
    if(removed>0){save();var msg="❌ "+removed+" repetida"+(removed!==1?"s":"")+" quitada"+(removed!==1?"s":"");bulkResult={ok:true,msg:msg};render();}
    return;
  }
  save();
  var msg="❌ "+removed+" repetida"+(removed!==1?"s":"")+" quitada"+(removed!==1?"s":"");
  if(bad.length>0) msg+=" | ⚠️ No encontradas: "+bad.join(", ");
  bulkResult={ok:bad.length===0,msg:msg};bulkText="";render();
}

function bulkCheck(){
  var ta=document.getElementById("bulkta");
  if(!ta) return;
  var parts=ta.value.split(/[,;\s\n]+/);
  var have=[],miss=[],bad=[];
  for(var i=0;i<parts.length;i++){
    var c=parts[i].trim().toUpperCase();if(!c) continue;
    var found=null;
    for(var si=0;si<SECS.length&&!found;si++)
      for(var sj=0;sj<SECS[si].stickers.length;sj++)
        if(SECS[si].stickers[sj].c.toUpperCase()===c){found=SECS[si].stickers[sj].c;break;}
    if(!found){bad.push(c);}
    else if(owned[found]){have.push(found);}
    else{miss.push(found);}
  }
  var h='<div style="margin-top:10px">';
  h+='<div class="bulk-result" style="background:#dcfce7;color:#16a34a">✅ Ya tienes ('+have.length+'): '+(have.length?have.join(", "):"ninguna")+'</div>';
  h+='<div class="bulk-result" style="background:#fee2e2;color:#dc2626;margin-top:6px">❌ Te faltan ('+miss.length+'): '+(miss.length?miss.join(", "):"ninguna")+'</div>';
  if(bad.length) h+='<div class="bulk-result" style="background:#fef3c7;color:#92400e;margin-top:6px">⚠️ No encontradas: '+bad.join(", ")+'</div>';
  h+='</div>';
  checkResult=h;bulkText=ta.value;render();
}

      rh+='</div></div>';
    }

      rh+='<div style="background:#f5ece8;border-radius:10px;padding:10px;margin-top:8px">';
      rh+='<div style="font-size:12px;font-weight:600;color:#9b5e4a;margin-bottom:4px">❌ No tienes repetidas ('+have.length+')</div>';
      rh+='<div style="font-size:11px;color:#9a918a;line-height:1.6;max-height:60px;overflow-y:auto">'+have.join(', ')+'</div>';
      rh+='</div>';
    }
    if(bad.length>0){
      rh+='<div style="font-size:11px;color:#9a918a;margin-top:8px">⚠️ No encontradas: '+bad.join(', ')+'</div>';
    }
    if(need.length===0&&have.length===0&&bad.length===0){
      rh+='<div style="text-align:center;color:#9a918a;margin-top:12px;font-size:13px">Pega las repetidas para comparar</div>';
    }
    if(need.length===0&&(have.length>0||bad.length>0)){
      rh+='<div style="background:#fef3c7;border-radius:10px;padding:10px;margin-top:8px;text-align:center"><div style="font-size:12px;font-weight:600;color:#92400e">No tienes repetidas de las que le faltan</div></div>';
    }
    rDiv.innerHTML=rh;
  };

function buildExportText(){
  var codes=[];
  for(var i=0;i<SECS.length;i++){
    for(var j=0;j<SECS[i].stickers.length;j++){
      var s=SECS[i].stickers[j];
      if(owned[s.c]){
        codes.push(s.c);
        var d=dupes[s.c]||0;
        for(var k=0;k<d;k++) codes.push(s.c);
      }
    }
  }
  return codes.join(", ");
}
function buildMissingText(){
  var codes=[];
  for(var i=0;i<SECS.length;i++){
    for(var j=0;j<SECS[i].stickers.length;j++){
      var s=SECS[i].stickers[j];
      if(!owned[s.c]) codes.push(s.c);
    }
  }
  return codes.join(", ");
}
function buildDupesText(){
  var codes=[];
  for(var i=0;i<SECS.length;i++){
    for(var j=0;j<SECS[i].stickers.length;j++){
      var s=SECS[i].stickers[j],d=dupes[s.c]||0;
      if(d>0) codes.push(s.c+(d>1?" x"+d:""));
    }
  }
  return codes.join(", ");
}
function buildOwnedOnlyText(){
  var codes=[];
  for(var i=0;i<SECS.length;i++){
    for(var j=0;j<SECS[i].stickers.length;j++){
      var s=SECS[i].stickers[j];
      if(owned[s.c]) codes.push(s.c);
    }
  }
  return codes.join(", ");
}
function copyExport(){
  var ta=document.getElementById("exportta");
  if(!ta) return;
  ta.select();ta.setSelectionRange(0,99999);
  try{navigator.clipboard.writeText(ta.value).then(function(){showToast("✅ ¡Copiado al portapapeles!");});}
  catch(e){document.execCommand("copy");showToast("✅ ¡Copiado al portapapeles!");}
}

// ─── INIT ───────────────────────────────────────────────
render();
window.addEventListener('beforeunload',function(){saveNow();});
window.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')saveNow();});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    reg.update();
    setInterval(function(){reg.update();},60000);
    reg.addEventListener('updatefound',function(){
      var nw=reg.installing;
      if(!nw)return;
      nw.addEventListener('statechange',function(){
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          nw.postMessage({type:'SKIP_WAITING'});
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    window.location.reload();
  });
}
</script>
